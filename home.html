<title>活動情報グリッド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f0e8;
    --surface: #ffffff;
    --ink: #232320;
    --ink-soft: #55534c;
    --accent: #e4b73a;
    --accent-ink: #4a3a08;
    --line: #e4dfd2;
    --icon: #232320;
    --radius: 10px;
    --font-display: "Zen Kaku Gothic New", "Noto Sans JP", sans-serif;
    --font-body: "Noto Sans JP", "Zen Kaku Gothic New", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1b18;
      --surface: #26251f;
      --ink: #f2efe6;
      --ink-soft: #c7c2b4;
      --accent: #f0c452;
      --accent-ink: #2a2004;
      --line: #38362e;
      --icon: #f2efe6;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1b18;
    --surface: #26251f;
    --ink: #f2efe6;
    --ink-soft: #c7c2b4;
    --accent: #f0c452;
    --accent-ink: #2a2004;
    --line: #38362e;
    --icon: #f2efe6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(8px, 2.5vw, 20px);
    padding: clamp(4px, 1vw, 8px);
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--line);
    padding: clamp(14px, 4vw, 28px) clamp(8px, 3vw, 16px);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card .icon {
    width: clamp(36px, 10vw, 56px);
    height: clamp(36px, 10vw, 56px);
    color: var(--icon);
    margin-bottom: clamp(8px, 2.5vw, 16px);
  }

  .card h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(13px, 3.6vw, 20px);
    margin: 0 0 clamp(6px, 2vw, 12px);
    letter-spacing: 0.02em;
  }

  .card .accent-bar {
    width: 24px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    margin-bottom: clamp(8px, 2.5vw, 14px);
  }

  .card p {
    margin: 0 0 0.35em;
    font-size: clamp(10px, 2.8vw, 14px);
    line-height: 1.5;
    color: var(--ink-soft);
  }

  .card p:last-child { margin-bottom: 0; }
</style>

<div class="grid">
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="m8.5 14 2 2 4-4"/></svg>
    <h2>活動日</h2>
    <div class="accent-bar"></div>
    <p>毎週金曜日</p>
    <p>18:30〜21:00(参加自由)</p>
  </div>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    <h2>活動場所</h2>
    <div class="accent-bar"></div>
    <p>二見グラウンド</p>
    <p>〒519-0606</p>
    <p>三重県伊勢市二見町西大字荘2066</p>
  </div>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10a1 1 0 0 1 1 1v17l-2.5-1.5L13 21l-1.5-1.5L10 21l-2.5-1.5L5 21V4a1 1 0 0 1 1-1z"/><path d="M9 8h6M9 12h4"/></svg>
    <h2>会費</h2>
    <div class="accent-bar"></div>
    <p>1回500円</p>
    <p>(備品購入代として)</p>
  </div>
</div>
